apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mywebsite-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: mywebsite.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mywebsite-deploy
            port:
              number: 80